nameOverride: ""

# Render the application workload itself (Deployment, Service, HTTPRoute,
# PVCs and Namespace). Set to false to use this chart purely as a component
# library, e.g. to provision only a `database` and/or `cache` next to another
# chart that ships the workload.
enabled: true

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

replicas: 1
containerPort: 80
servicePort: 80
strategy: RollingUpdate

hostNetwork: false
# Optional: set to false to keep the ServiceAccount token out of the pod
# automountServiceAccountToken: false

namespace:
  enabled: true

dns:
  enabled: true
  hostname: ""
  exposure: "internal"

homepage:
  enabled: true
  name: ""
  description: ""
  icon: ""
  group: "Applications"
  weight: "10"

ingress:
  proxyBodySize: "100m"
  path: "/"
  annotations: {}

containerSecurityContext: {}

volumes: []
# Each entry:
#   - name: data
#     size: 1Gi
#     mountPath: /data
#     storageClass: local-path    (default)
#     accessMode: ReadWriteOnce (default)
#   - name: shared-nfs
#     mountPath: /shared
#     nfs:
#       server: 192.168.1.201
#       path: /shared-data/nas-storage
#       readOnly: true

infisical:
  enabled: false
  identityId: ""
  secretsPath: ""
  secretName: ""
  # Optional CR name; defaults to "<app>-infisical-secret".
  # Keep the previous name when migrating an existing app so the managed
  # Secret is not garbage-collected along with the old CR.
  nameOverride: ""
  projectSlug: "homelab-k8s"
  envSlug: "prod"
  resyncInterval: 60

env: {}
envFrom: []
extraEnv: []

initContainers: []
# Example:
#   - name: wait-db
#     image: busybox
#     command: ['sh', '-c', 'until nc -z db 5432; do sleep 1; done']

extraContainers: []
# Additional sidecar/worker containers rendered inside the same pod.
# Each entry is a full Kubernetes container spec (env, envFrom, volumeMounts,
# resources and securityContext must be repeated per container).
# Example:
#   - name: worker
#     image: "registry.ganam.app/my-app:1.0.0"
#     args: ["worker"]
#     volumeMounts:
#       - name: data
#         mountPath: /data

securityContext: {}
# Example:
#   runAsUser: 1000
#   runAsGroup: 1000
#   fsGroup: 1000
#   fsGroupChangePolicy: OnRootMismatch

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

probes:
  liveness:
    enabled: true
    type: httpGet # Options: httpGet, tcpSocket, exec
    path: "/"
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    type: httpGet # Options: httpGet, tcpSocket, exec
    path: "/"
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Managed PostgreSQL through CloudNativePG (requires infra/cloudnative-pg).
# Renders a `postgresql.cnpg.io/v1` Cluster. The operator publishes the
# connection details in the "<name>-app" Secret and the read-write Service
# "<name>-rw".
database:
  enabled: false
  # Defaults to "<app>-db".
  name: ""
  instances: 1
  # Pin the operand image; CNPG requires images built by the project.
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie"
  storage:
    size: 1Gi
    storageClass: local-path
  # Database and role created on first bootstrap.
  database: ""
  owner: ""
  # Secret holding the bootstrap credentials. It must contain the keys
  # `username` and `password`. Defaults to "<name>-credentials".
  bootstrapSecret:
    name: ""
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      memory: "1Gi"

# In-cluster Valkey (Redis-compatible) cache.
cache:
  enabled: false
  # Defaults to "<app>-cache".
  name: ""
  image:
    repository: valkey/valkey
    tag: "9.0.7"
  # A cache does not need durable storage; keep this disabled unless the app
  # really needs its contents to survive a restart.
  persistence:
    enabled: false
    size: 1Gi
    storageClass: local-path
  # Optional password. When `name` is set, the referenced Secret key is passed
  # to Valkey via --requirepass.
  passwordSecret:
    name: ""
    key: password
  resources:
    requests:
      cpu: "20m"
      memory: "128Mi"
    limits:
      memory: "512Mi"
