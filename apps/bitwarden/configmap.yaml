apiVersion: v1
kind: ConfigMap
metadata:
  name: bitwarden
  namespace: bitwarden
data:
  # Non-secret Vaultwarden settings
  ROCKET_PORT: "8080"
  ROCKET_WORKERS: "2"
  DOMAIN: "https://bitwarden.ganam.app"
  ROCKET_ADDRESS: "0.0.0.0"
  SIGNUPS_ALLOWED: "false"
  # Websocket notifications are served on the main Rocket port since
  # Vaultwarden 1.32 (WEBSOCKET_* settings deprecated/ignored)
  DATA_FOLDER: "/data"
  # SMTP config removed - add back to enable email support
  # SMTP_FROM: "noreply@example.com"
  # SMTP_HOST: "smtp.example.com"
  # SMTP_PORT: "587"
  # SMTP_SECURITY: "starttls" # tls|starttls|off
