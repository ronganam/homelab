apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bitwarden
  namespace: bitwarden
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - bitwarden.ganam.app
  rules:
    # Websocket notifications are served on the main port since Vaultwarden
    # 1.32 (WEBSOCKET_PORT deprecated). The / prefix rule below covers
    # /notifications/hub, so no dedicated rule is needed.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: bitwarden
          port: 80
          weight: 1
