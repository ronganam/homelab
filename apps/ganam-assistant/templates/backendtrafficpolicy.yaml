apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "app.name" . }}-timeout
  namespace: {{ include "app.namespace" . }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ include "app.name" . }}
  timeout:
    http:
      requestTimeout: "0s"
      maxStreamDuration: "0s"
