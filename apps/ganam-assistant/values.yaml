app-blueprint:
  image:
    repository: registry.ganam.app/ganam-assistant
    tag: "6.3.0"

  containerPort: 8080

  dns:
    hostname: assistant.ganam.app
    exposure: internal

  homepage:
    enabled: true
    name: "Ganam Assistant"
    group: "Applications"
    icon: "material-symbols:smart-toy-outline"

  volumes:
    - name: database-local
      size: 128Mi
      mountPath: /app/db
      storageClass: local-path

  infisical:
    enabled: true
    identityId: "646edad3-7cfd-466a-b6cd-6114b3682e3c"
    secretsPath: "/ganam-assistant"
    secretName: ganam-assistant-secret

  env:
    # All app data (DB, call recordings, media, uploads, APKs) lives next to
    # the database, i.e. on the PVC mounted at /app/db.
    DATABASE_PATH: "/app/db/db.sqlite3"
    TIMEZONE: "Asia/Jerusalem"
    # Callers that reach the pod via the ClusterIP Service (Home Assistant
    # integration, WAHA webhook) are trusted; everything through the gateway
    # must present API_TOKEN (set in Infisical).
    INTERNAL_HOSTS: "ganam-assistant.ganam-assistant,ganam-assistant.ganam-assistant.svc,ganam-assistant.ganam-assistant.svc.cluster.local"

  # Velero copies volume files, which can catch SQLite mid-write. This hook
  # writes a consistent copy to /app/db/snapshots/db.sqlite3 first; restore
  # from that file.
  podAnnotations:
    pre.hook.backup.velero.io/container: ganam-assistant
    pre.hook.backup.velero.io/command: '["sh", "-c", "cd /app && python3 -m core.db_snapshot"]'
    pre.hook.backup.velero.io/timeout: 2m

  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch

  resources:
    requests:
      cpu: 25m
      memory: 400Mi
    limits:
      memory: 750Mi

  probes:
    liveness:
      enabled: true
      type: tcpSocket
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      enabled: true
      type: tcpSocket
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
