apiVersion: v2
name: infisical
description: Helm wrapper chart to deploy Infisical with secure secret management
type: application
version: 0.1.0
appVersion: "1.0.1"
dependencies:
  - name: infisical-standalone
    version: "1.11.0"
    repository: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
  # The database and cache come from the shared blueprint component chart
  # (CloudNativePG Cluster + Valkey) instead of Bitnami subcharts.
  - name: app-blueprint
    version: "0.1.0"
    repository: "file://../_blueprint"
