# Values for Infisical (Secure Deployment)
infisical-standalone:
  infisical:
    replicaCount: 1
    kubeSecretRef: "infisical-secrets"
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: "55m"
        memory: "800Mi"
      limits:
        memory: "1200Mi"
  ingress:
    enabled: false
    ingressClassName: nginx
    nginx:
      enabled: false
    hostName: infisical.ganam.app
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Infisical"
      gethomepage.dev/description: "Secret Management Platform"
      gethomepage.dev/icon: "infisical.png"
      gethomepage.dev/group: "Security"
      gethomepage.dev/weight: "10"

  # Disable bundled charts
  postgresql:
    enabled: false
    # Tell Infisical to use our secret for the connection string
    useExistingPostgresSecret:
      enabled: true
      existingConnectionStringSecret:
        name: "infisical-secrets"
        key: "DB_CONNECTION_URI"

  redis:
    enabled: false
    # Redis URL will be picked up from envFrom (infisical-secrets)
    # because the bundled redis is disabled, the chart won't override it.

# Database and cache are provided by the shared blueprint component chart in
# apps/_blueprint. `enabled: false` suppresses its Deployment/Service (the
# workload comes from infisical-standalone); only database/cache are rendered.
app-blueprint:
  enabled: false
  namespace:
    enabled: false

  database:
    enabled: true
    name: infisical-db
    instances: 1
    imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie"
    storage:
      size: 1Gi
      storageClass: local-path
    database: infisicalDB
    owner: infisical
    # infisical-secrets is managed out-of-band by create-secret.sh and exposes
    # the `username`/`password` keys CloudNativePG uses for the first bootstrap.
    bootstrapSecret:
      name: infisical-secrets
    resources:
      requests:
        cpu: "50m"
        memory: "256Mi"
      limits:
        memory: "1Gi"

  # Valkey replaces the deprecated Bitnami Redis image. Infisical only uses it
  # as a cache, so it runs without persistence.
  cache:
    enabled: true
    name: infisical-cache
    image:
      repository: valkey/valkey
      tag: "9.0.7"
    passwordSecret:
      name: infisical-secrets
      key: redis-password
    resources:
      requests:
        cpu: "20m"
        memory: "128Mi"
      limits:
        memory: "512Mi"
