# INTERNAL Service - accessible via ingress
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
    dns.service-controller.io/enabled: "true"
    dns.service-controller.io/hostname: "jellyfin.ganam.app"
    exposure.service-controller.io/type: "internal"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8096
      protocol: TCP
  selector:
    app: jellyfin
---
# EXTERNAL Service - direct access via pinned MetalLB IP
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-external
  namespace: jellyfin
  labels:
    app: jellyfin
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerIP: 192.168.1.155
  ports:
    - name: http
      port: 8096
      targetPort: 8096
      protocol: TCP
  selector:
    app: jellyfin


