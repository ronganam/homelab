# Values for Matomo deployment via blueprint component chart

app-blueprint:
  enabled: true
  nameOverride: "matomo"

  image:
    repository: "docker.io/library/matomo"
    tag: "5.14.2-apache"
    pullPolicy: IfNotPresent

  replicas: 0

  containerPort: 80

  dns:
    enabled: true
    hostname: "matomo.ganam.app"
    exposure: "internal"

  homepage:
    enabled: true
    name: "Matomo"
    description: "Web Analytics"
    icon: "matomo.png"
    group: "Monitoring"
    weight: "10"

  volumes:
    - name: data
      size: 1Gi
      storageClass: local-path
      mountPath: /var/www/html

  infisical:
    enabled: true
    identityId: "646edad3-7cfd-466a-b6cd-6114b3682e3c"
    projectSlug: "homelab-k8s"
    envSlug: "prod"
    secretsPath: "/matomo"
    nameOverride: "matomo-mariadb"
    secretName: "matomo-mariadb"
    resyncInterval: 60

  mariadb:
    enabled: true
    name: matomo-mariadb
    image:
      repository: mariadb
      tag: "11.4"
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    auth:
      database: matomo
      username: matomo
      passwordSecret:
        name: matomo-mariadb
        key: mariadb-password
        rootKey: mariadb-root-password
    resources:
      requests:
        cpu: "50m"
        memory: "256Mi"
      limits:
        memory: "1Gi"

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      memory: "768Mi"

logImporter:
  enabled: false
