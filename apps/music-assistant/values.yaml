app-blueprint:
  image:
    repository: ghcr.io/music-assistant/server
    tag: "2.10.4"

  containerPort: 8095
  servicePort: 8095

  # MA requires host network (same L2 as players) for mDNS/uPnP discovery
  hostNetwork: true
  strategy: Recreate

  dns:
    hostname: music.ganam.app
    exposure: internal

  homepage:
    name: Music Assistant
    description: Your music, your way
    icon: music-assistant.png
    weight: "40"

  volumes:
    - name: data
      size: 1Gi
      mountPath: /data

  env:
    LOG_LEVEL: "info"

  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi

  probes:
    liveness:
      enabled: true
      type: httpGet
      path: "/"
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      enabled: true
      type: httpGet
      path: "/"
      initialDelaySeconds: 30
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3