app-blueprint:
  image:
    repository: devlikeapro/waha
    tag: "noweb-2026.7.2"

  containerPort: 3000

  dns:
    hostname: waha.ganam.app
    exposure: internal

  homepage:
    name: "WAHA"
    description: "WhatsApp HTTP API"
    icon: "whatsapp.png"

  volumes:
    - name: sessions-local
      size: 128Mi
      mountPath: /app/.sessions
      storageClass: local-path
    - name: media-local
      size: 512Mi
      mountPath: /app/.media
      storageClass: local-path

  infisical:
    enabled: true
    identityId: "646edad3-7cfd-466a-b6cd-6114b3682e3c"
    secretsPath: "/waha"
    secretName: waha-secret

  env:
    WHATSAPP_DEFAULT_ENGINE: "NOWEB"

    # Stable worker ID so sessions stay assigned and auto-restart across pod restarts
    WAHA_WORKER_ID: "waha"
    # Start all previously saved sessions after container restarts
    WHATSAPP_RESTART_ALL_SESSIONS: "True"
    WAHA_WORKER_RESTART_SESSIONS: "True"

    # Keep the session offline (no online presence on start or after API activity)
    WAHA_PRESENCE_AUTO_ONLINE: "False"
    WAHA_PRINT_QR: "False"

    # Persist media files on the mounted PVC (default folder /tmp/whatsapp-files is ephemeral)
    WHATSAPP_FILES_FOLDER: "/app/.media"

  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

  probes:
    liveness:
      path: "/ping"
    readiness:
      path: "/ping"

  resources:
    requests:
      cpu: 15m
      memory: 600Mi
    limits:
      memory: 900Mi
