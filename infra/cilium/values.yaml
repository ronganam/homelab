cilium:
  cluster:
    name: homelab
    id: 1

  # Core CNI Settings
  ipam:
    mode: kubernetes
  kubeProxyReplacement: true
  k8sServiceHost: 192.168.1.101
  k8sServicePort: 6443

  # L7 Visibility + Hubble
  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true
    metrics:
      enabled:
        - dns
        - drop
        - tcp
        - flow
        - icmp
        - http

  # Infrastructure Integration
  operator:
    replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
