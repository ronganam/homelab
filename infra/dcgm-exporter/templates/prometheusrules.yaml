apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dcgm-exporter-gpu-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dcgm-exporter
spec:
  groups:
    - name: gpu.rules
      rules:
        - alert: NvidiaGpuExporterDown
          expr: |
            absent(DCGM_FI_DEV_GPU_UTIL)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "DCGM exporter is down"
            description: "No NVIDIA GPU metrics are being collected for at least 10 minutes."
        - alert: NvidiaGpuTemperatureHigh
          expr: |
            DCGM_FI_DEV_GPU_TEMP > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "GPU temperature high ({{ "{{ $value }}" }}°C)"
            description: "GPU {{ "{{ $labels.gpu }}" }} on {{ "{{ $labels.hostname }}" }} is at {{ "{{ $value }}" }}°C, close to the 94°C thermal limit."
        - alert: NvidiaGpuMemoryTemperatureHigh
          expr: |
            DCGM_FI_DEV_MEMORY_TEMP > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "GPU memory temperature high ({{ "{{ $value }}" }}°C)"
            description: "GPU {{ "{{ $labels.gpu }}" }} on {{ "{{ $labels.hostname }}" }} memory is at {{ "{{ $value }}" }}°C."
        - alert: NvidiaGpuXidError
          expr: |
            DCGM_FI_DEV_XID_ERRORS != 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "GPU XID error ({{ "{{ $value }}" }})"
            description: "GPU {{ "{{ $labels.gpu }}" }} on {{ "{{ $labels.hostname }}" }} reported XID error {{ "{{ $value }}" }}. Check the driver and dmesg for details."
